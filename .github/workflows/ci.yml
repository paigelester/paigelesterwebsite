name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check; runs on master
# always finish so a later deploy is never cancelled partway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static checks and unit tests run in parallel with the build so failures surface fast.
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing check, not just the first.
      fail-fast: false
      matrix:
        check:
          - { name: Type-check, script: typecheck }
          - { name: Lint, script: lint }
          - { name: Format check, script: format:check }
          - { name: Unit tests, script: test }
          - { name: Overrides guard, script: check:overrides }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.check.script }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The static export, reused by later jobs such as end-to-end and deploy.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          if-no-files-found: error
